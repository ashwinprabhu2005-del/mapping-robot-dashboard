# Simplified config - depth camera only

robot:
  id: "depth_cam_001"
  name: "Depth Camera Unit"

network:
  docker_host_ip: "FILL_THIS_IN"  # User fills this in
  mqtt_port: 1883
  mqtt_username: "amr_robot"
  mqtt_password: "amr_password"

# Only publish these topics:
publish_rates:
  color_image_hz: 10        # Color camera at 10 FPS
  depth_points_hz: 1        # Full point cloud every second
  cloud_map_hz: 0.5         # SLAM map every 2 seconds
  occupancy_grid_hz: 1      # 2D map at 1 Hz
  heartbeat_hz: 1           # Status every second
